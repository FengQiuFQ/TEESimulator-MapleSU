name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -e
          find . -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 -r -n1 bash -n
          echo "shell syntax ok"

      - name: Python syntax
        run: |
          set -e
          files=$(git ls-files '*.py' || true)
          if [ -n "$files" ]; then
            python3 -m py_compile $files
          fi
          echo "python syntax ok"

      - name: WebUI syntax
        run: |
          set -e
          if command -v node >/dev/null 2>&1; then
            files=$(git ls-files 'module/**/*.js' || true)
            if [ -n "$files" ]; then
              for file in $files; do node --check "$file"; done
            fi
            echo "webui syntax ok"
          else
            echo "node not installed, skipping"
          fi

      - name: WebUI translations, file lists and contrast
        run: |
          if command -v node >/dev/null 2>&1; then
            node tools/check_webroot.js
          else
            echo "node not installed, skipping"
          fi

      - name: Compatibility check tests
        run: bash tools/test_compat.sh

  package:
    name: Package module
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A release build needs two inputs that are intentionally not committed:
      # the assembled classes.dex and the upstream core assets (daemon, injector,
      # supervisor, libcertgen.so). Without them this job reports and skips.
      #
      # hashFiles() is not available in a job-level `if:` (actions runner rejects
      # it there), so the check runs in a step and the build is gated on its output.
      - name: Check build inputs
        id: inputs
        run: |
          if [ -f dex/classes.dex ] && [ -d module/core-assets ]; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
          else
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "skipping package: dex/classes.dex or module/core-assets is absent"
          fi

      - name: Build zip
        if: steps.inputs.outputs.ready == '1'
        env:
          MAPLESU_TEE_DEX: dex/classes.dex
        run: |
          set -e
          python3 tools/package_teesimulator_bundle.py
          sha256sum dist/*.zip

      - uses: actions/upload-artifact@v4
        if: steps.inputs.outputs.ready == '1'
        with:
          name: module-zip
          path: dist/*.zip
