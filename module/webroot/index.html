<!DOCTYPE html>
<html lang="en" class="booting" data-theme="autumn" data-scheme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <script>
        /* Runs before first paint so the saved theme never flashes. The manager that
           hosts this page can set the scheme and colours through MapleSUAppearance. */
        (function () {
            var root = document.documentElement, host = window.MapleSUAppearance;
            var theme = 'autumn', scheme = 'auto';
            try {
                theme = localStorage.getItem('maplesu-tee-theme') || theme;
                scheme = localStorage.getItem('maplesu-tee-scheme') || scheme;
            } catch (e) {}
            if (!/^(spring|summer|autumn|winter)$/.test(theme)) theme = 'autumn';
            if (host && host.scheme) scheme = host.scheme;
            if (scheme !== 'light' && scheme !== 'dark') {
                scheme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            root.setAttribute('data-theme', theme);
            root.setAttribute('data-scheme', scheme);
            /* A manager may still send the token names of earlier versions, and the accent
               tint used to follow the accent, so sending only the accent has to keep working. */
            var renamed = { '--error': '--err', '--green': '--ok', '--red-soft': '--accent-bg' };
            window.teeHostColors = function (colors) {
                Object.keys(colors).forEach(function (key) { root.style.setProperty(renamed[key] || key, colors[key]); });
                if (colors['--accent'] && !colors['--accent-bg'] && !colors['--red-soft']) {
                    root.style.setProperty('--accent-bg', 'color-mix(in srgb, ' + colors['--accent'] + ' 12%, transparent)');
                }
            };
            if (host && host.colors) window.teeHostColors(host.colors);
            /* If startup fails, show the page rather than leave it blank. */
            var reveal = function () { root.classList.remove('booting'); };
            window.addEventListener('error', reveal);
            window.addEventListener('unhandledrejection', reveal);
        })();
    </script>
    <title>MapleSU</title>
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
    <script src="locales.js"></script>
</head>

<body>
    <svg class="sprite" width="0" height="0" aria-hidden="true">
        <symbol id="leaf" viewBox="0 0 24 24">
            <path d="M12 1.5 13.7 5.2 16.2 4.2 15.4 8.6 18.2 6.8 19.5 9.5 22.5 9.1 21 12.6 22.4 13.6 17.8 17.4 18.3 19.6 12.9 18.9 13.1 22.8H10.9L11.1 18.9 5.7 19.6 6.2 17.4 1.6 13.6 3 12.6 1.5 9.1 4.5 9.5 5.8 6.8 8.6 8.6 7.8 4.2 10.3 5.2Z"/>
        </symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 7h9M19 7h1M4 17h1M11 17h9"/>
            <circle fill="none" stroke="currentColor" stroke-width="1.8" cx="16" cy="7" r="2.6"/>
            <circle fill="none" stroke="currentColor" stroke-width="1.8" cx="8" cy="17" r="2.6"/>
        </symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 3.5v4h-4"/>
        </symbol>
    </svg>
    <svg class="bg-leaf" aria-hidden="true"><use href="#leaf"></use></svg>

    <main class="shell">
        <header class="topbar">
            <svg class="brand-leaf" aria-hidden="true"><use href="#leaf"></use></svg>
            <div class="brand-text">
                <h1 data-i18n="app.title"></h1>
                <code id="module-version"></code>
            </div>
            <button id="btn-reload" class="icon-btn" type="button" data-i18n-aria-label="app.refresh" data-i18n-title="app.refresh">
                <svg aria-hidden="true"><use href="#icon-refresh"></use></svg>
            </button>
            <button id="btn-settings" class="icon-btn" type="button" data-i18n-aria-label="app.settings" data-i18n-title="app.settings">
                <svg aria-hidden="true"><use href="#icon-settings"></use></svg>
            </button>
        </header>

        <div class="statusline" role="status">
            <span id="page-state" class="statusline-text"></span>
            <span id="backend-mode" class="chip"></span>
        </div>
        <p id="page-detail" class="status-detail" hidden></p>

        <div id="keybox-warning" class="banner" role="alert" hidden>
            <b data-i18n="keybox.warnTitle"></b>
            <span id="keybox-warning-body"></span>
        </div>

        <div class="columns">
            <div class="col">
                <section id="compat-card" class="card" hidden>
                    <div class="card-head">
                        <h2 data-i18n="compat.title"></h2>
                        <span id="compat-chip" class="chip" hidden></span>
                    </div>
                    <p id="compat-summary" class="desc" hidden></p>
                    <ul id="compat-list" class="checks"></ul>
                    <p id="compat-time" class="hint" hidden></p>
                    <div class="btn-row">
                        <button id="compat-run" type="button" class="btn" data-i18n="compat.recheck"></button>
                        <button id="compat-toggle" type="button" class="btn btn-quiet" hidden></button>
                    </div>
                </section>

                <section id="keybox-card" class="card">
                    <div class="card-head">
                        <h2 data-i18n="keybox.title"></h2>
                        <span id="keybox-chip" class="chip" hidden></span>
                    </div>
                    <div class="kv"><span data-i18n="keybox.active"></span><b id="keybox-active"></b></div>
                    <div class="kv"><span data-i18n="keybox.digest"></span><code id="keybox-sha"></code></div>
                    <div class="field">
                        <label for="keybox-select" data-i18n="keybox.switch"></label>
                        <div class="input-row">
                            <select id="keybox-select" class="input" disabled></select>
                            <button id="btn-apply-keybox" type="button" class="btn btn-primary" data-i18n="common.apply" disabled></button>
                        </div>
                    </div>
                    <p class="hint" data-i18n="keybox.hint"></p>
                </section>

                <section id="kbu-card" class="card" hidden>
                    <div class="card-head">
                        <h2 data-i18n="kbu.title"></h2>
                        <span id="kbu-chip" class="chip" hidden></span>
                    </div>
                    <p class="desc" data-i18n="kbu.desc"></p>
                    <div class="row">
                        <div class="row-main">
                            <div class="row-title" data-i18n="kbu.enable"></div>
                            <div id="kbu-sub" class="row-sub"></div>
                        </div>
                        <label class="switch">
                            <input id="toggle-kbu" type="checkbox" role="switch" data-i18n-aria-label="kbu.enable" disabled>
                            <span class="track"><span class="thumb"></span></span>
                        </label>
                    </div>
                    <p id="kbu-kept" class="note" data-i18n="kbu.kept" hidden></p>
                    <div class="field">
                        <label for="kbu-source" data-i18n="kbu.source"></label>
                        <select id="kbu-source" class="input" disabled></select>
                    </div>
                    <div id="kbu-custom-row" class="field" hidden>
                        <label for="kbu-custom-url" data-i18n="kbu.customUrl"></label>
                        <input id="kbu-custom-url" type="url" class="input input-mono" inputmode="url" dir="ltr"
                            placeholder="https://example.com/keybox.xml" autocomplete="off" spellcheck="false" disabled>
                    </div>
                    <div class="field">
                        <label for="kbu-interval" data-i18n="kbu.interval"></label>
                        <div class="input-row">
                            <input id="kbu-interval" type="number" class="input" min="0" max="8760" step="1" inputmode="numeric" disabled>
                            <button id="btn-kbu-save" type="button" class="btn btn-primary" data-i18n="common.save" disabled></button>
                        </div>
                    </div>
                    <div class="kv"><span data-i18n="kbu.last"></span><b id="kbu-last"></b></div>
                    <div class="kv"><span data-i18n="kbu.result"></span><b id="kbu-result"></b></div>
                    <div class="kv"><span data-i18n="kbu.next"></span><b id="kbu-next"></b></div>
                    <div class="kv"><span data-i18n="kbu.url"></span><code id="kbu-url" dir="ltr"></code></div>
                    <div class="btn-row">
                        <button id="btn-kbu-now" type="button" class="btn" data-i18n="kbu.now" disabled></button>
                    </div>
                    <p id="kbu-hint" class="hint"></p>
                </section>

                <section id="patch-card" class="card">
                    <div class="card-head"><h2 data-i18n="patch.title"></h2></div>
                    <p class="desc" data-i18n="patch.desc"></p>
                    <div id="patch-mode" class="seg" role="group" data-i18n-aria-label="patch.title">
                        <button type="button" class="seg-btn" data-mode="auto" data-i18n="patch.modeAuto" disabled></button>
                        <button type="button" class="seg-btn" data-mode="fixed" data-i18n="patch.modeFixed" disabled></button>
                    </div>
                    <div id="patch-fixed-row" class="field" hidden>
                        <label for="patch-date" data-i18n="patch.date"></label>
                        <div class="input-row">
                            <input id="patch-date" type="date" class="input" disabled>
                            <button id="btn-apply-patch" type="button" class="btn btn-primary" data-i18n="common.apply" disabled></button>
                        </div>
                    </div>
                    <div class="kv"><span data-i18n="patch.device"></span><code id="patch-device"></code></div>
                    <div class="kv"><span data-i18n="patch.effective"></span><code id="patch-effective"></code></div>
                    <p class="hint" data-i18n="patch.hint"></p>
                </section>
            </div>

            <div class="col">
                <section id="soter-card" class="card">
                    <div class="card-head">
                        <h2 data-i18n="soter.title"></h2>
                        <span id="soter-chip" class="chip" hidden></span>
                    </div>
                    <p class="desc" data-i18n="soter.desc"></p>
                    <div class="row">
                        <div class="row-main">
                            <div class="row-title" data-i18n="soter.enable"></div>
                            <div id="soter-sub" class="row-sub"></div>
                        </div>
                        <label class="switch">
                            <input id="toggle-soter" type="checkbox" role="switch" data-i18n-aria-label="soter.enable" disabled>
                            <span class="track"><span class="thumb"></span></span>
                        </label>
                    </div>
                    <div class="row">
                        <div class="row-main">
                            <div class="row-title" data-i18n="soter.certs"></div>
                            <div id="soter-certs-sub" class="row-sub"></div>
                        </div>
                        <label class="switch">
                            <input id="toggle-soter-certs" type="checkbox" role="switch" data-i18n-aria-label="soter.certs" disabled>
                            <span class="track"><span class="thumb"></span></span>
                        </label>
                    </div>
                    <p id="soter-certs-hint" class="hint"></p>
                </section>

                <section id="scope-card" class="card">
                    <div class="card-head">
                        <h2 data-i18n="scope.title"></h2>
                        <span id="scope-chip" class="chip" hidden></span>
                    </div>
                    <p class="desc" data-i18n="scope.desc"></p>
                    <div id="scope-alert" class="note" hidden>
                        <span data-i18n="scope.allAlert"></span>
                        <button id="scope-narrow" type="button" class="btn btn-small" disabled></button>
                    </div>
                    <input id="scope-search" type="search" class="input" data-i18n-placeholder="scope.search"
                        data-i18n-aria-label="scope.search" autocomplete="off" spellcheck="false" enterkeyhint="search" disabled>
                    <div class="kv kv-tight"><span data-i18n="scope.selected"></span><b id="scope-count"></b></div>
                    <div class="seg seg-actions" role="group" data-i18n-aria-label="scope.selected">
                        <button id="scope-select-all" type="button" class="seg-btn" data-i18n="scope.selectAll" disabled></button>
                        <button id="scope-invert" type="button" class="seg-btn" data-i18n="scope.invert" disabled></button>
                        <button id="scope-clear" type="button" class="seg-btn" data-i18n="scope.clear" disabled></button>
                    </div>
                    <div id="scope-list" class="scope-list" role="list" data-i18n-aria-label="scope.list"></div>
                    <p id="scope-empty" class="hint" hidden></p>
                    <div class="btn-row">
                        <button id="scope-save" type="button" class="btn btn-primary" data-i18n="common.save" disabled></button>
                        <button id="scope-restore" type="button" class="btn" data-i18n="scope.restore" disabled></button>
                    </div>
                    <p class="hint" data-i18n="scope.hint"></p>
                </section>

                <section id="system-card" class="card">
                    <div class="card-head"><h2 data-i18n="system.title"></h2></div>
                    <div class="row">
                        <div class="row-main">
                            <div class="row-title" data-i18n="system.hideBl"></div>
                            <div id="hide-bl-sub" class="row-sub"></div>
                        </div>
                        <label class="switch">
                            <input id="toggle-hide-bl" type="checkbox" role="switch" data-i18n-aria-label="system.hideBl" disabled>
                            <span class="track"><span class="thumb"></span></span>
                        </label>
                    </div>
                    <div class="row">
                        <div class="row-main">
                            <div class="row-title" data-i18n="system.auto"></div>
                            <div id="target-sub" class="row-sub"></div>
                        </div>
                        <label class="switch">
                            <input id="toggle-auto-target" type="checkbox" role="switch" data-i18n-aria-label="system.auto" disabled>
                            <span class="track"><span class="thumb"></span></span>
                        </label>
                    </div>
                </section>

                <details id="diag-card" class="card">
                    <summary data-i18n="diag.title"></summary>
                    <div class="row">
                        <div class="row-main">
                            <div class="row-title" data-i18n="diag.debug"></div>
                            <div id="diag-sub" class="row-sub"></div>
                        </div>
                        <label class="switch">
                            <input id="toggle-debug" type="checkbox" role="switch" data-i18n-aria-label="diag.debug" disabled>
                            <span class="track"><span class="thumb"></span></span>
                        </label>
                    </div>
                    <div class="btn-row">
                        <button id="btn-export-logs" type="button" class="btn" data-i18n="diag.export" disabled></button>
                        <button id="btn-copy-path" type="button" class="btn btn-quiet" data-i18n="diag.copy" hidden></button>
                    </div>
                    <p id="diag-result" class="value-line" hidden></p>
                    <p id="diag-hint" class="hint"></p>
                </details>

                <details id="takeover-card" class="card">
                    <summary data-i18n="exp.title"></summary>
                    <div class="row">
                        <div class="row-main">
                            <div class="row-title" data-i18n="exp.takeover"></div>
                            <div id="takeover-sub" class="row-sub"></div>
                        </div>
                        <label class="switch">
                            <input id="toggle-key-takeover" type="checkbox" role="switch" data-i18n-aria-label="exp.takeover" disabled>
                            <span class="track"><span class="thumb"></span></span>
                        </label>
                    </div>
                    <p class="hint" data-i18n="exp.takeoverHint"></p>
                </details>

                <details id="about-card" class="card">
                    <summary data-i18n="about.title"></summary>
                    <div class="kv"><span data-i18n="about.version"></span><code id="ver-version"></code></div>
                    <div class="kv"><span data-i18n="about.author"></span><b id="ver-author"></b></div>
                    <div class="kv"><span data-i18n="about.dex"></span><code id="ver-dex"></code></div>
                    <div class="kv"><span data-i18n="about.keybox"></span><code id="ver-keybox"></code></div>
                    <div class="kv"><span data-i18n="about.build"></span><code id="ver-build"></code></div>
                    <div class="kv"><span data-i18n="about.backend"></span><b id="ver-backend"></b></div>
                </details>
            </div>
        </div>
    </main>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
        <h2 id="settings-title" data-i18n="settings.title"></h2>
        <p id="settings-hosted" class="hint" data-i18n="settings.hosted" hidden></p>

        <div class="field">
            <div class="field-label" id="season-label" data-i18n="settings.season"></div>
            <div id="season-choice" class="seasons" role="group" aria-labelledby="season-label">
                <button type="button" class="season" data-value="spring"><svg class="season-leaf" aria-hidden="true"><use href="#leaf"></use></svg><span data-i18n="season.spring"></span></button>
                <button type="button" class="season" data-value="summer"><svg class="season-leaf" aria-hidden="true"><use href="#leaf"></use></svg><span data-i18n="season.summer"></span></button>
                <button type="button" class="season" data-value="autumn"><svg class="season-leaf" aria-hidden="true"><use href="#leaf"></use></svg><span data-i18n="season.autumn"></span></button>
                <button type="button" class="season" data-value="winter"><svg class="season-leaf" aria-hidden="true"><use href="#leaf"></use></svg><span data-i18n="season.winter"></span></button>
            </div>
        </div>

        <div class="field">
            <div class="field-label" id="scheme-label" data-i18n="settings.scheme"></div>
            <div id="scheme-choice" class="seg" role="group" aria-labelledby="scheme-label">
                <button type="button" class="seg-btn" data-value="auto" data-i18n="scheme.auto"></button>
                <button type="button" class="seg-btn" data-value="light" data-i18n="scheme.light"></button>
                <button type="button" class="seg-btn" data-value="dark" data-i18n="scheme.dark"></button>
            </div>
        </div>

        <div class="field">
            <label for="language-select" data-i18n="settings.language"></label>
            <select id="language-select" class="input"></select>
        </div>

        <button id="btn-settings-done" type="button" class="btn btn-primary btn-wide" data-i18n="common.done"></button>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="request.js"></script>
    <script src="main.js"></script>
</body>

</html>
